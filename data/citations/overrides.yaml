# Reviewed citation metadata - hand-written, never generated.
#
# One block per canonical URL, holding CSL fields that override whatever the
# resolvers found (or failed to find). See task:0032 D4.
#
# Use this for sources no API describes: a paywalled paper, a PDF with no
# metadata, a page behind a bot check, a dead link you have found an archived
# copy of. Every field is optional; what you give wins, what you leave out
# falls back to the resolvers.
#
#   https://example.org/some-report.pdf:
#     title: The Title As Printed On The Document
#     author:
#       - literal: Some Institute          # organisation: no given/family split
#       - family: Chollet
#         given: François
#     issued: { date-parts: [[2024, 5]] }  # year, or year and month, or full date
#     type: report                         # see CSL_TYPES in store.py
#     container-title: Journal or Publisher
#     DOI: 10.1000/example
#
# An explicit `null` REMOVES a field a resolver got wrong; omitting the field
# keeps whatever is already there. `container-title: null` on a report is the
# usual case - a report has a publisher, and APA renders a container as
# "In Some Institute." in the middle of the reference.
#
# `atlas citations propose` writes a starting point for each unresolved entry,
# with whatever evidence could be gathered, into overrides.proposed.yaml.
#
# Applied by `atlas citations extract`, above every resolver, and never
# re-fetched: `resolve --redo` refuses to target an entry this file owns.
#
# ## Provenance
#
# Each block says where its metadata came from. Three sources appear here:
#
#   owner      - the owner opened the document and read its own citation block.
#   crossref   - a deterministic Crossref lookup (by DOI, by Elsevier PII, or by
#                exact journal volume and first page). Never a title search:
#                task:0032 D3 measured that returning a *different* paper at an
#                indistinguishable score, which is worse than no answer.
#   citoid     - Wikimedia's public Zotero translation server, which reaches
#                pages our own scrapers cannot. One-off batch, 2026-09-24.
#
# Where a source also needs a fix in the Google Doc (a wrong link, or anchor
# text that disagrees with the document it points at), the block says so and
# task:0035 carries the full list.


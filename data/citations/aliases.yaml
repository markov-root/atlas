# Citation identity decisions - hand-written, never generated.
#
# Canonicalization merges two URLs only when they are the same document by
# construction. Everything else needs a person to say so. See task:0031.
#
# aliases: the key is the entry to KEEP; the list folds onto it. The surviving
# entry keeps its own metadata and records the others as `sameAs`.
#
#   https://deepmind.google/discover/blog/specification-gaming:
#     - https://deepmind.com/blog/specification-gaming
#
# not-duplicates: groups `atlas citations report` flags that are NOT the same
# work. Listing one here stops the report repeating it, so the duplicates
# section stays a worklist instead of a standing complaint.
#
#   - - https://example.org/a
#     - https://example.org/b
#
# Every entry below was checked against the two pages before it was written.
# The rules applied, in the order they decide:
#
#   1. A cross-post keeps the Alignment Forum copy where one exists (owner,
#      2026-09-24); failing that, the venue the author posted to first.
#   2. A preprint beats a publisher landing page or a CDN copy of the same PDF,
#      because arXiv has a stable address and machine-readable metadata (owner,
#      2026-09-24: "a preference for papers on places like arxiv").
#   3. A landing page beats a bare CDN asset path where there is no preprint.
#   4. Where one site serves two paths, the live current one wins.
#
# A lab's announcement post about a paper is NOT a copy of that paper, and is
# never aliased onto it. See the `not-duplicates` entries at the foot.


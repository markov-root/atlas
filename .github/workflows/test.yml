name: Test
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
        # Needed by pnpm test:a11y (axe-core via Playwright). Installs
        # chromium plus the OS libraries the headless build needs.
      - run: pnpm verify
        # Contributor mode: no secrets needed. Public Algolia keys come
        # from astro.config.mjs defaults. pnpm verify chain:
        # lint → lint:actions → typecheck → test → build → test:smoke → test:a11y
